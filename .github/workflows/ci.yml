name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests (zero-dependency)
        run: node --test tests/*.test.mjs
      - name: Syntax check CLI
        run: |
          node --check party.mjs
          node --check setup-connector.mjs
