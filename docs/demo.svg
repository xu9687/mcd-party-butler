<text xml:space="preserve" x="24" y="66" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#7ee787">$ node party.mjs sessions --spu 11308 --store 1450713 --date 2026-10-17 --available</text>
