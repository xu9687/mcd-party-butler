<text xml:space="preserve" x="24" y="263" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#8b8b9e">示例摘要：场次 36925878 · 15:30-17:00 · 5-12人 · 剩余 12 名额 · 价格 ¥118</text>
<text xml:space="preserve" x="24" y="298" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#7ee787">$ node party.mjs book --spu 11308 --sku 11936 --store 1450713 --date 2026-10-17 --session 36925878 --party-type 2 --count 5</text>
<text xml:space="preserve" x="24" y="320" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#8b8b9e">麦麦派对管家 v1.0.0 · 数据来自麦当劳官方 MCP · 仅供参考</text>
