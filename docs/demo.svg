<text xml:space="preserve" x="24" y="534" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#7ee787">本次未调用 party-order-create，未产生任何订单。</text>
<text xml:space="preserve" x="24" y="555" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="13" fill="#8b8b9e">如确认无误，请追加 --confirm 后重新执行本命令以提交订单。</text>
